[env:freenove_esp32_s3_wroom]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino
lib_deps = 
	madhephaestus/ESP32Servo@^3.2.1
	sparkfun/SparkFun BMI270 Arduino Library@^1.0.3
	adafruit/Adafruit BMP5xx Library@^1.0.3
	greiman/SdFat@^2.3.1
